name: Build KAIRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get KAIRO project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extract KAIRO
        run: |
          if [ -f KAIRO-v0.1.zip ]; then
            unzip -q -o KAIRO-v0.1.zip
            ls -la
            ls -la KAIRO-v0.1
          else
            echo "KAIRO-v0.1.zip not found. Checking for source directory..."
            ls -la
          fi

      - name: Build APK
        working-directory: KAIRO-v0.1
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload KAIRO APK
        uses: actions/upload-artifact@v4
        with:
          name: KAIRO-APK
          path: KAIRO-v0.1/app/build/outputs/apk/debug/app-debug.apk
